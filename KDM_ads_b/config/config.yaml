network:
  projection_head:
    mlp_hidden_size: 512
    projection_size: 128
  projection_cat:
    mlp_hidden_size: 512
    projection_size: 155

trainer:
  batch_size: 128
  m: 0.996 # momentum update
  max_epochs: 300
  class_start: 0
  class_end: 89
  lr: 0.001 # lr= 0.2*batch/256

iteration: 50

finetune:
  batch_size: 10
  test_batch_size: 10
  epochs: 200
  class_start: 90
  class_end: 99
  lr: 0.0005
  k_shot: 5
